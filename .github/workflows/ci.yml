name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dependency versions
        run: python -c "import fastapi, starlette; print(fastapi.__version__, starlette.__version__)"

      - name: Run Tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTIFY_SERVICE_URL: ${{ secrets.NOTIFY_SERVICE_URL }}
        run: pytest tests/ -v

  test-notify:
    name: Node Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: notify
        run: npm install

      - name: Run Tests
        working-directory: notify
        run: npm test

  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Bandit Scan
        continue-on-error: true
        run: |
          bandit -r app \
            -f json \
            -o reports/sast.bandit.json

      - name: Upload SAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast.bandit.json
          path: reports/sast.bandit.json

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/sca.pip-audit.json

      - name: Upload SCA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca.pip-audit.json
          path: reports/sca.pip-audit.json

  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest

    needs:
      - test
      - test-notify

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t fastapi-app:latest .

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Trivy Scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: fastapi-app:latest
          format: json
          output: reports/container.trivy.json
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Verify Report
        if: always()
        run: |
          ls -la reports
          test -f reports/container.trivy.json && echo "Report created"

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: reports/container.trivy.json

      - name: Fail workflow if vulnerabilities found
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "High/Critical vulnerabilities found."
          exit 1

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - test
      - test-notify
      - sast
      - sca
      - container-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:${{ github.sha }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:latest

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:latest

